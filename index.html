
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strategic Tracking and Automated Registry (S.T.A.R.)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { void: '#030712', cyber: { cyan: '#00f3ff', amber: '#f59e0b', rose: '#f43f5e', emerald: '#10b981', dark: '#0b0f19' } } } }
        }
    </script>
    
    <!-- Leaflet CSS & JS for Tactical GIS Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030712; 
            background-image: radial-gradient(circle at center, rgba(3, 7, 18, 0.3) 0%, rgba(3, 7, 18, 0.95) 100%), url('STAR Portal Hub.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f3f4f6; 
            -webkit-tap-highlight-color: transparent; 
        }
        .font-mono { font-family: 'Share Tech Mono', monospace; }
        .glow-cyan { box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        .glow-amber { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
        .cyber-panel { 
            background: linear-gradient(135deg, rgba(11, 15, 25, 0.75) 0%, rgba(3, 7, 18, 0.88) 100%); 
            border: 1px solid rgba(0, 243, 255, 0.3); 
            backdrop-filter: blur(12px); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        
        /* Fixed scanlines overlay - pointer-events: none ensures inputs remain fully clickable */
        .scanlines-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.2) 50%, rgba(0, 0, 0, 0.2));
            background-size: 100% 4px; opacity: 0.6;
        }
        
        .custom-map-pin { background: transparent; border: none; }
        
        /* Modal strict layering */
        .modal-overlay { z-index: 10000; }
        .modal-content { position: relative; z-index: 10001; pointer-events: auto; }
    </style>
</head>
<body class="min-h-[100dvh] bg-void text-gray-100 flex flex-col overflow-x-hidden">
    <div class="scanlines-overlay"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup - Replace DEMO_MODE_REPLACE_ME with your actual Vercel/Firebase API Key if using cloud
        const firebaseConfig = {
            apiKey: "DEMO_MODE_REPLACE_ME", 
            authDomain: "star-command.firebaseapp.com",
            projectId: "star-command",
            storageBucket: "star-command.firebasestorage.app",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        
        let app, db, auth, cloudUser;
        let isCloudEnabled = false;
        const appId = 'star-command-center';
        
        const getCol = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
        const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

        window.currentActiveUser = null;
        window.soundEnabled = true;
        window.isLoginMode = true;
        window.tacticalMap = null;
        window.tacticalMarkers = {};
        window.mediaRecorder = null;
        window.audioChunks = [];
        window.isRecordingAudio = false;
        window.editingAgentId = null;

        // DUAL ENGINE STORAGE: Loads from LocalStorage first to guarantee zero-data loss & persistence
        window.DEMO_USERS = JSON.parse(localStorage.getItem('star_db_users')) || {
            'STAR-ADMIN': { id: 'STAR-ADMIN', name: 'Commander Admin', clearance: 'ADMIN', pass: 'ILOV3BJMP7', passHash: 'ILOV3BJMP7', status: 'APPROVED', photo: '', rank: 'Director', position: 'Command HQ', additionalInfo: {} }
        };
        window.pendingRegistrations = JSON.parse(localStorage.getItem('star_db_pending')) || {};
        window.agentSessionLogs = JSON.parse(localStorage.getItem('star_db_logs')) || [];
        window.appBranding = JSON.parse(localStorage.getItem('star_db_branding')) || { logoUrl: '', appName: 'S.T.A.R.' };
        window.commsMessages = [];

        window.sanitizeHTML = function(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        window.persistLocalData = function() {
            localStorage.setItem('star_db_users', JSON.stringify(window.DEMO_USERS));
            localStorage.setItem('star_db_pending', JSON.stringify(window.pendingRegistrations));
            localStorage.setItem('star_db_logs', JSON.stringify(window.agentSessionLogs));
            localStorage.setItem('star_db_branding', JSON.stringify(window.appBranding));
        }

        async function initCloudSync() {
            try {
                if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "DEMO_MODE_REPLACE_ME") {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    await signInAnonymously(auth);
                    cloudUser = auth.currentUser;
                    isCloudEnabled = true;
                    setupCloudListeners();
                } else {
                    console.log("Running in Local Offline Mode. Data is safely persisting to browser local storage.");
                }
            } catch (err) {
                console.warn("Cloud sync init failed, falling back to local mode:", err);
            } finally {
                checkLocalAuthSession();
                applyBranding();
            }
        }

        function setupCloudListeners() {
            if (!isCloudEnabled) return;
            onSnapshot(getCol('agents'), (snapshot) => {
                window.DEMO_USERS = {}; window.pendingRegistrations = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.status === 'APPROVED') window.DEMO_USERS[doc.id] = data;
                    else if (data.status === 'PENDING') window.pendingRegistrations[doc.id] = data;
                });
                window.persistLocalData();
                renderActiveAgentRoster(); renderAdminPendingApprovals();
            });

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'branding'), (docSnap) => {
                if (docSnap.exists()) { window.appBranding = docSnap.data(); window.persistLocalData(); applyBranding(); }
            });

            onSnapshot(getCol('locations'), (snapshot) => { snapshot.forEach(doc => { window.updateRemoteAgentMarker(doc.data()); }); });

            const qComms = query(getCol('comms'), orderBy('createdAt', 'asc'), limit(50));
            onSnapshot(qComms, (snapshot) => {
                let msgs = []; snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                window.commsMessages = msgs; renderCommsStream();
            });

            const qLogs = query(getCol('logs'), orderBy('createdAt', 'desc'), limit(50));
            onSnapshot(qLogs, (snapshot) => {
                let logs = []; snapshot.forEach(doc => logs.push(doc.data()));
                window.agentSessionLogs = logs; window.persistLocalData(); renderSessionLogsTable();
            });
        }

        function applyBranding() {
            document.querySelectorAll('.app-title-slot').forEach(el => el.innerText = window.appBranding.appName || 'S.T.A.R.');
            document.querySelectorAll('.app-logo-slot').forEach(el => {
                if (window.appBranding.logoUrl) {
                    el.innerHTML = `<img src="${window.sanitizeHTML(window.appBranding.logoUrl)}" class="w-full h-full object-cover">`;
                } else {
                    el.innerHTML = `<span class="text-cyan-400 font-bold font-mono text-[10px]">STAR</span>`;
                }
            });
        }

        window.openLogoConfigModal = function() {
            document.getElementById('logo-url-input').value = window.appBranding.logoUrl || '';
            document.getElementById('app-name-input').value = window.appBranding.appName || 'S.T.A.R.';
            document.getElementById('modal-logo-config').classList.remove('hidden');
        }
        window.closeLogoConfigModal = function() { document.getElementById('modal-logo-config').classList.add('hidden'); }

        window.handleLogoConfigSubmit = async function(e) {
            e.preventDefault();
            const newBranding = {
                logoUrl: document.getElementById('logo-url-input').value.trim(),
                appName: document.getElementById('app-name-input').value.trim() || 'S.T.A.R.'
            };
            window.appBranding = newBranding;
            window.persistLocalData();
            if (isCloudEnabled) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'branding'), newBranding);
            applyBranding(); window.closeLogoConfigModal(); window.showToast("Branding updated globally.");
        }

        window.toggleAuthMode = function() {
            window.isLoginMode = !window.isLoginMode;
            document.getElementById('auth-login-form').classList.toggle('hidden');
            document.getElementById('auth-register-form').classList.toggle('hidden');
            document.getElementById('auth-title').innerText = window.isLoginMode ? "S.T.A.R. AUTHORIZATION" : "RECRUIT CLEARANCE REQUEST";
            document.getElementById('auth-error-msg').classList.add('hidden');
        }

        window.handleRegistrationSubmit = async function(e) {
            e.preventDefault();
            const id = window.sanitizeHTML(document.getElementById('reg-input-id').value.trim().toUpperCase());
            const name = window.sanitizeHTML(document.getElementById('reg-input-name').value.trim());
            const pass = document.getElementById('reg-input-password').value.trim();
            const photo = document.getElementById('reg-input-photo').value.trim();

            if (window.DEMO_USERS[id] || window.pendingRegistrations[id]) {
                window.showToast("Operative ID already in use or pending."); return;
            }

            const newReg = { id, name, pass, passHash: pass, photo, clearance: 'FIELD', status: 'PENDING', additionalInfo: {} };
            window.pendingRegistrations[id] = newReg;
            window.persistLocalData();
            if (isCloudEnabled) await setDoc(getDocRef('agents', id), newReg);

            window.showToast(`Request submitted for ${id}. Awaiting Admin Approval.`);
            document.getElementById('auth-register-form').reset();
            window.toggleAuthMode();
        }

        window.handleAuthLoginSubmit = async function(e) {
            e.preventDefault();
            const idInput = window.sanitizeHTML(document.getElementById('auth-input-id').value.trim().toUpperCase());
            const passInput = document.getElementById('auth-input-password').value.trim();
            const errorMsg = document.getElementById('auth-error-msg');

            if (window.pendingRegistrations[idInput]) {
                errorMsg.innerText = "ACCOUNT PENDING ADMIN APPROVAL."; errorMsg.classList.remove('hidden'); return;
            }

            const isMasterOverride = (idInput === 'STAR-ADMIN' && passInput === 'ILOV3BJMP7');
            let foundUser = window.DEMO_USERS[idInput];

            if (isMasterOverride && !foundUser) {
                foundUser = { id: 'STAR-ADMIN', name: 'Commander Admin', clearance: 'ADMIN', pass: 'ILOV3BJMP7', passHash: 'ILOV3BJMP7', status: 'APPROVED' };
                window.DEMO_USERS['STAR-ADMIN'] = foundUser;
            }

            const userPassword = foundUser ? (foundUser.pass || foundUser.passHash) : null;

            if ((foundUser && userPassword === passInput && foundUser.status === 'APPROVED') || isMasterOverride) {
                window.currentActiveUser = { ...(foundUser || { id: 'STAR-ADMIN', name: 'Commander Admin', clearance: 'ADMIN' }), expiresAt: Date.now() + (8 * 60 * 60 * 1000) };
                localStorage.setItem('star_auth_user', JSON.stringify(window.currentActiveUser));
                
                const logEntry = {
                    agentId: window.currentActiveUser.id, name: window.currentActiveUser.name, clearance: window.currentActiveUser.clearance,
                    timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
                    ipDevice: navigator.userAgent.substring(0, 20) + '...', loginCoord: 'ACQUIRING GPS...', createdAt: Date.now()
                };

                window.agentSessionLogs.unshift(logEntry);
                window.persistLocalData();
                let logDocRef = null;
                if (isCloudEnabled) logDocRef = await addDoc(getCol('logs'), logEntry);

                document.getElementById('modal-auth-login').classList.add('hidden');
                enforceRoleBasedUI(); window.startLiveGpsTracking(); window.showToast(`Welcome, ${window.currentActiveUser.name}`);

                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        async (pos) => {
                            logEntry.loginCoord = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
                            window.persistLocalData();
                            if (isCloudEnabled && logDocRef) await updateDoc(logDocRef, { loginCoord: logEntry.loginCoord });
                            renderSessionLogsTable();
                        },
                        (err) => console.warn("GPS Access Denied"),
                        { enableHighAccuracy: true, timeout: 5000 }
                    );
                }
            } else {
                errorMsg.innerText = `INVALID CREDENTIALS`; errorMsg.classList.remove('hidden');
            }
        }

        function checkLocalAuthSession() {
            try {
                const storedUser = localStorage.getItem('star_auth_user');
                if (storedUser) {
                    const parsed = JSON.parse(storedUser);
                    if (parsed && parsed.expiresAt && parsed.expiresAt > Date.now()) {
                        window.currentActiveUser = parsed;
                        document.getElementById('modal-auth-login').classList.add('hidden');
                        enforceRoleBasedUI(); window.startLiveGpsTracking(); return;
                    }
                }
            } catch (e) { localStorage.removeItem('star_auth_user'); }
            document.getElementById('modal-auth-login').classList.remove('hidden');
        }

        window.logoutUserSession = function() {
            localStorage.removeItem('star_auth_user'); window.currentActiveUser = null;
            enforceRoleBasedUI(); document.getElementById('modal-auth-login').classList.remove('hidden');
            window.showToast("Session Terminated.");
        }

        function enforceRoleBasedUI() {
            if (!window.currentActiveUser) return;
            const isAdm = window.currentActiveUser.clearance === 'ADMIN';

            document.getElementById('nav-desk-roster').classList.toggle('hidden', !isAdm);
            document.getElementById('nav-desk-logs').classList.toggle('hidden', !isAdm);
            document.getElementById('nav-mob-roster').classList.toggle('hidden', !isAdm);
            document.getElementById('nav-mob-logs').classList.toggle('hidden', !isAdm);
            document.getElementById('admin-branding-btn').classList.toggle('hidden', !isAdm);
            document.getElementById('btn-header-signin').classList.add('hidden');
            document.getElementById('btn-header-signout').classList.remove('hidden');

            renderActiveAgentRoster(); renderAdminPendingApprovals(); renderSessionLogsTable(); renderCommsStream();
            
            const activeTab = document.querySelector('main div[id^="tab-"]:not(.hidden)');
            if (!isAdm && activeTab && (activeTab.id === 'tab-roster' || activeTab.id === 'tab-logs')) {
                window.switchTab('comms');
            }
        }

        window.switchTab = function(tabId) {
            if (window.currentActiveUser && window.currentActiveUser.clearance !== 'ADMIN') {
                if (tabId === 'roster' || tabId === 'logs') tabId = 'comms';
            }
            ['comms', 'map', 'roster', 'logs'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (el) el.classList.add('hidden');
                const btnDesk = document.getElementById(`nav-desk-${t}`);
                const btnMob = document.getElementById(`nav-mob-${t}`);
                if (btnDesk) { btnDesk.classList.remove('text-amber-300', 'bg-amber-950/40', 'border-amber-500'); btnDesk.classList.add('text-gray-400', 'border-transparent'); }
                if (btnMob) { btnMob.classList.remove('text-amber-300', 'bg-amber-950/40', 'border-amber-500'); btnMob.classList.add('text-gray-400', 'border-transparent'); }
            });
            
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const activeDesk = document.getElementById(`nav-desk-${tabId}`);
            const activeMob = document.getElementById(`nav-mob-${tabId}`);
            if (activeDesk) { activeDesk.classList.add('text-amber-300', 'bg-amber-950/40', 'border-amber-500'); activeDesk.classList.remove('text-gray-400', 'border-transparent'); }
            if (activeMob) { activeMob.classList.add('text-amber-300', 'bg-amber-950/40', 'border-amber-500'); activeMob.classList.remove('text-gray-400', 'border-transparent'); }

            if (tabId === 'map') { setTimeout(() => { if (!window.tacticalMap) window.initTacticalGpsMap(); else window.tacticalMap.invalidateSize(); }, 200); }
            if (tabId === 'roster') { renderActiveAgentRoster(); renderAdminPendingApprovals(); }
            if (tabId === 'logs') { renderSessionLogsTable(); }
        }

        window.showToast = function(msg) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const t = document.createElement('div');
            t.className = 'cyber-panel p-3 rounded border-cyan-400 text-xs font-bold text-white glow-cyan font-mono z-50 pointer-events-none';
            t.innerText = window.sanitizeHTML(msg);
            container.appendChild(t); setTimeout(() => t.remove(), 3500);
        }

        function renderCommsStream() {
            const stream = document.getElementById('comms-messages-stream');
            if (!stream) return;
            const isNearBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 100;

            stream.innerHTML = window.commsMessages.map(msg => `
                <div class="p-3 rounded-lg bg-cyan-950/40 border border-cyan-500/20 font-mono text-xs space-y-2">
                    <div class="flex items-center justify-between text-[10px] text-cyan-400/80">
                        <span class="font-bold text-cyan-300">${window.sanitizeHTML(msg.senderName)}</span>
                        <span>${window.sanitizeHTML(msg.timestamp)}</span>
                    </div>
                    <p class="text-gray-200 text-sm whitespace-pre-wrap">${window.sanitizeHTML(msg.text)}</p>
                    ${msg.audioUrl ? `<div class="pt-1"><audio controls src="${msg.audioUrl}" class="w-full h-8 accent-cyan-400"></audio></div>` : ''}
                    ${msg.imageUrl ? `<div class="pt-2"><img src="${msg.imageUrl}" class="w-full rounded border border-cyan-500/50 object-contain max-h-64"></div>` : ''}
                    ${msg.videoUrl ? `<div class="pt-2"><video controls src="${msg.videoUrl}" class="w-full rounded border border-cyan-500/50 object-contain max-h-64"></video></div>` : ''}
                </div>
            `).join('');
            if (isNearBottom) stream.scrollTop = stream.scrollHeight;
        }

        window.handleCommsSubmit = async function(e) {
            e.preventDefault();
            const input = document.getElementById('comms-input-text');
            if (!input || !input.value.trim()) return;

            const newMsg = {
                senderName: window.currentActiveUser ? window.currentActiveUser.name : 'Agent',
                senderId: window.currentActiveUser ? window.currentActiveUser.id : 'UNK',
                text: window.sanitizeHTML(input.value.trim()),
                timestamp: new Date().toLocaleTimeString(),
                createdAt: Date.now()
            };

            window.commsMessages.push(newMsg); renderCommsStream(); input.value = '';
            if (isCloudEnabled) await addDoc(getCol('comms'), newMsg);
        }

        window.handleIntelFileUpload = function(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { window.showToast("File exceeds 5MB secure limit."); return; }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const newMsg = {
                    senderName: window.currentActiveUser ? window.currentActiveUser.name : 'Agent',
                    senderId: window.currentActiveUser ? window.currentActiveUser.id : 'UNK',
                    text: type === 'image' ? '[TACTICAL PHOTO INTEL]' : '[TACTICAL VIDEO INTEL]',
                    timestamp: new Date().toLocaleTimeString(),
                    imageUrl: type === 'image' ? reader.result : null,
                    videoUrl: type === 'video' ? reader.result : null,
                    createdAt: Date.now()
                };
                window.commsMessages.push(newMsg); renderCommsStream();
                if (isCloudEnabled) await addDoc(getCol('comms'), newMsg);
            };
            event.target.value = '';
        }

        window.toggleVoiceRecording = async function() {
            const recordBtn = document.getElementById('voice-record-btn');
            const statusLabel = document.getElementById('voice-status-label');

            if (!window.isRecordingAudio) {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("API_NOT_SUPPORTED");
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    window.mediaRecorder = new MediaRecorder(stream);
                    window.audioChunks = [];
                    window.mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) window.audioChunks.push(event.data); };
                    window.mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(window.audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader(); reader.readAsDataURL(audioBlob);
                        reader.onloadend = async function() {
                            const newVoiceMsg = {
                                senderName: window.currentActiveUser ? window.currentActiveUser.name : 'Agent',
                                senderId: window.currentActiveUser ? window.currentActiveUser.id : 'ID',
                                text: '[ENCRYPTED TACTICAL VOICE MEMO]',
                                timestamp: new Date().toLocaleTimeString(),
                                audioUrl: reader.result, createdAt: Date.now()
                            };
                            window.commsMessages.push(newVoiceMsg); renderCommsStream();
                            if (isCloudEnabled) await addDoc(getCol('comms'), newVoiceMsg);
                        }
                        stream.getTracks().forEach(track => track.stop());
                    };

                    window.mediaRecorder.start(); window.isRecordingAudio = true;
                    if (recordBtn) recordBtn.classList.add('bg-rose-950', 'text-rose-300', 'border-rose-500', 'animate-pulse');
                    if (statusLabel) statusLabel.innerText = "RECORDING (5s MAX)...";
                    
                    setTimeout(() => {
                        if (window.mediaRecorder && window.mediaRecorder.state !== 'inactive') {
                            window.mediaRecorder.stop(); window.isRecordingAudio = false;
                            if (recordBtn) recordBtn.classList.remove('bg-rose-950', 'text-rose-300', 'border-rose-500', 'animate-pulse');
                            if (statusLabel) statusLabel.innerText = "RECORD VOICE MEMO";
                        }
                    }, 5000);

                } catch (err) {
                    window.isRecordingAudio = false;
                    window.showToast("MIC BLOCKED: Ensure URL is HTTPS and check browser permissions.");
                }
            } else {
                if (window.mediaRecorder && window.mediaRecorder.state !== 'inactive') window.mediaRecorder.stop();
                window.isRecordingAudio = false;
                if (recordBtn) recordBtn.classList.remove('bg-rose-950', 'text-rose-300', 'border-rose-500', 'animate-pulse');
                if (statusLabel) statusLabel.innerText = "RECORD VOICE MEMO";
            }
        }

        window.initTacticalGpsMap = function() {
            const mapContainer = document.getElementById('tactical-map');
            if (!mapContainer || window.tacticalMap || typeof L === 'undefined') return;
            
            window.tacticalMap = L.map('tactical-map', { center: [10.3157, 123.8854], zoom: 15 });
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20 }).addTo(window.tacticalMap);
            L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20 }).addTo(window.tacticalMap);
            
            setTimeout(() => window.tacticalMap.invalidateSize(), 300);
        }

        window.updateRemoteAgentMarker = function(data) {
            if (!window.tacticalMap || typeof L === 'undefined' || !data) return;
            const id = data.id || data.agentId;
            if (!id) return;
            
            const userObj = window.DEMO_USERS[id] || {};
            const photo = data.photo || userObj.photo;
            const name = data.name || userObj.name || id;
            const lat = data.lat; const lng = data.lng;

            if (typeof lat !== 'number' || typeof lng !== 'number') return;

            const iconHtml = photo 
                ? `<div class="w-9 h-9 rounded-full border-2 border-cyan-400 overflow-hidden bg-void glow-cyan"><img src="${window.sanitizeHTML(photo)}" class="w-full h-full object-cover"></div>`
                : `<div class="w-8 h-8 rounded-full bg-cyan-500 border-2 border-white flex items-center justify-center text-[10px] font-bold text-black glow-cyan">${window.sanitizeHTML(id.substring(0,3))}</div>`;

            const customIcon = L.divIcon({ className: 'custom-map-pin', html: iconHtml, iconSize: [36, 36], iconAnchor: [18, 18] });

            if (!window.tacticalMarkers[id]) {
                window.tacticalMarkers[id] = L.marker([lat, lng], { icon: customIcon }).addTo(window.tacticalMap);
            } else {
                window.tacticalMarkers[id].setLatLng([lat, lng]); window.tacticalMarkers[id].setIcon(customIcon);
            }

            window.tacticalMarkers[id].bindPopup(`
                <div class="font-mono text-xs space-y-1 bg-void p-2 rounded border border-cyan-500">
                    <div class="font-bold text-cyan-400 text-center">${window.sanitizeHTML(name)}</div>
                    <div class="text-[10px] text-gray-300 text-center">ID: ${window.sanitizeHTML(id)}</div>
                    <div class="text-[10px] text-emerald-400 text-center">COORD: ${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
                </div>
            `);
        }

        window.startLiveGpsTracking = function() {
            if ("geolocation" in navigator && window.currentActiveUser) {
                window.hasCenteredMap = false;
                navigator.geolocation.watchPosition(
                    async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        const locData = { agentId: window.currentActiveUser.id, name: window.currentActiveUser.name, photo: window.currentActiveUser.photo || '', lat: latitude, lng: longitude, timestamp: Date.now() };
                        if (window.tacticalMap && !window.hasCenteredMap) {
                            window.tacticalMap.setView([latitude, longitude], 16); window.hasCenteredMap = true;
                        }
                        window.updateRemoteAgentMarker(locData);
                        if (isCloudEnabled) await setDoc(getDocRef('locations', window.currentActiveUser.id), locData);
                    },
                    (err) => console.warn("GPS Warning:", err.message),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        function renderActiveAgentRoster() {
            const grid = document.getElementById('active-agent-roster-grid');
            if (!grid) return;

            grid.innerHTML = Object.values(window.DEMO_USERS).filter(u => u && u.status === 'APPROVED').map(user => {
                const avatarHtml = user.photo ? `<img src="${window.sanitizeHTML(user.photo)}" class="w-full h-full object-cover">` : user.id.substring(0,2);
                const canEdit = window.currentActiveUser && (window.currentActiveUser.clearance === 'ADMIN' || window.currentActiveUser.id === user.id);
                
                return `
                <div class="p-3 rounded-lg bg-cyan-950/20 border border-cyan-500/30 flex flex-col gap-2 font-mono text-xs">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-void border border-cyan-500/50 flex items-center justify-center text-cyan-300 font-bold glow-cyan overflow-hidden flex-shrink-0">${avatarHtml}</div>
                            <div class="min-w-0">
                                <div class="font-bold text-amber-400 tracking-wider text-sm truncate">${window.sanitizeHTML(user.id)}</div>
                                <div class="font-bold text-cyan-300 truncate">${window.sanitizeHTML(user.name)}</div>
                                <div class="text-[10px] text-gray-400 truncate">CLR: ${window.sanitizeHTML(user.clearance)}</div>
                            </div>
                        </div>
                        ${canEdit ? `<button onclick="window.openEditAgentModal('${user.id}')" class="p-1.5 bg-amber-950 border border-amber-500 text-amber-300 rounded hover:bg-amber-900 transition"><i data-lucide="edit" class="w-3 h-3"></i></button>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-1 text-[10px] text-gray-300 bg-void/50 p-2 rounded mt-1 border border-cyan-500/20">
                        <div>RANK: <span class="text-emerald-400">${window.sanitizeHTML(user.rank || 'N/A')}</span></div>
                        <div>POS: <span class="text-emerald-400">${window.sanitizeHTML(user.position || 'N/A')}</span></div>
                    </div>
                </div>`;
            }).join('') || '<div class="text-gray-400">No active personnel.</div>';
            if (window.lucide) lucide.createIcons();
        }

        window.openAddAgentModal = function() {
            if (!window.currentActiveUser || window.currentActiveUser.clearance !== 'ADMIN') return;
            document.getElementById('add-agent-form').reset();
            document.getElementById('modal-add-agent').classList.remove('hidden');
        }
        window.closeAddAgentModal = function() { document.getElementById('modal-add-agent').classList.add('hidden'); }

        window.handleManualAgentAdd = async function(e) {
            e.preventDefault();
            const id = window.sanitizeHTML(document.getElementById('add-agent-id').value.trim().toUpperCase());
            const name = window.sanitizeHTML(document.getElementById('add-agent-name').value.trim());
            const pass = document.getElementById('add-agent-pass').value.trim();
            const photo = document.getElementById('add-agent-photo').value.trim();
            const clearance = document.getElementById('add-agent-clearance').value;

            if (window.DEMO_USERS[id] || window.pendingRegistrations[id]) { window.showToast("Operative ID already exists."); return; }

            const newAgent = { id, name, pass, passHash: pass, photo, clearance, status: 'APPROVED' };
            window.DEMO_USERS[id] = newAgent;
            window.persistLocalData();
            if (isCloudEnabled) await setDoc(getDocRef('agents', id), newAgent);

            renderActiveAgentRoster(); window.showToast(`Agent ${id} added securely.`); window.closeAddAgentModal();
        }

        window.openEditAgentModal = function(id) {
            window.editingAgentId = id;
            const user = window.DEMO_USERS[id];
            document.getElementById('edit-agent-display-id').innerText = user.id;
            document.getElementById('edit-agent-name').value = user.name || '';
            document.getElementById('edit-agent-rank').value = user.rank || '';
            document.getElementById('edit-agent-position').value = user.position || '';
            document.getElementById('edit-agent-photo').value = user.photo || '';
            document.getElementById('edit-agent-new-password').value = '';
            document.getElementById('modal-edit-agent').classList.remove('hidden');
        }
        window.closeEditAgentModal = function() { window.editingAgentId = null; document.getElementById('modal-edit-agent').classList.add('hidden'); }

        window.saveAgentDetails = async function(e) {
            e.preventDefault();
            if(!window.editingAgentId) return;
            const user = window.DEMO_USERS[window.editingAgentId];
            user.name = document.getElementById('edit-agent-name').value.trim();
            user.rank = document.getElementById('edit-agent-rank').value.trim();
            user.position = document.getElementById('edit-agent-position').value.trim();
            user.photo = document.getElementById('edit-agent-photo').value.trim();
            
            const newPass = document.getElementById('edit-agent-new-password').value.trim();
            if (newPass && window.currentActiveUser.clearance === 'ADMIN') { user.pass = newPass; user.passHash = newPass; }
            
            window.persistLocalData();
            if (isCloudEnabled) await updateDoc(getDocRef('agents', user.id), user);
            
            renderActiveAgentRoster(); window.closeEditAgentModal(); window.showToast("Dossier updated successfully.");
        }

        function renderAdminPendingApprovals() {
            const grid = document.getElementById('pending-requests-grid');
            if (!grid) return;
            const pendingKeys = Object.keys(window.pendingRegistrations || {});
            const panel = document.getElementById('admin-pending-approvals-panel');
            if(panel) panel.classList.toggle('hidden', pendingKeys.length === 0 || !window.currentActiveUser || window.currentActiveUser.clearance !== 'ADMIN');
            
            grid.innerHTML = pendingKeys.map(id => {
                const reg = window.pendingRegistrations[id];
                const avatarHtml = reg.photo ? `<img src="${window.sanitizeHTML(reg.photo)}" class="w-full h-full object-cover">` : reg.id.substring(0,2);
                return `
                    <div class="p-3 rounded-lg bg-void border border-amber-500/30 flex items-center justify-between gap-3 font-mono text-xs">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded bg-cyan-900 border border-amber-500/50 flex items-center justify-center text-amber-300 font-bold overflow-hidden flex-shrink-0">${avatarHtml}</div>
                            <div>
                                <div class="font-bold text-amber-300">${window.sanitizeHTML(reg.name)}</div>
                                <div class="text-[10px] text-gray-400">ID: ${window.sanitizeHTML(reg.id)}</div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.approveNewRecruit('${id}')" class="px-3 py-1 bg-emerald-950 border border-emerald-500 text-emerald-300 rounded font-bold">OK</button>
                            <button onclick="window.rejectNewRecruit('${id}')" class="px-3 py-1 bg-rose-950 border border-rose-500 text-rose-300 rounded font-bold">NO</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.approveNewRecruit = async function(id) {
            if (window.pendingRegistrations && window.pendingRegistrations[id]) {
                const approvedData = { ...window.pendingRegistrations[id], status: 'APPROVED' };
                window.DEMO_USERS[id] = approvedData; delete window.pendingRegistrations[id];
                window.persistLocalData();
                if (isCloudEnabled) { await updateDoc(getDocRef('agents', id), { status: 'APPROVED' }); }
                renderActiveAgentRoster(); renderAdminPendingApprovals(); window.showToast(`Agent ${id} approved.`);
            }
        }

        window.rejectNewRecruit = async function(id) {
            if (window.pendingRegistrations && window.pendingRegistrations[id]) {
                delete window.pendingRegistrations[id]; window.persistLocalData();
                if (isCloudEnabled) await deleteDoc(getDocRef('agents', id));
                renderAdminPendingApprovals(); window.showToast(`Request denied.`);
            }
        }

        function renderSessionLogsTable() {
            const container = document.getElementById('session-audit-logs-container');
            if (!container) return;
            container.innerHTML = `

                                    <td class="p-2 text-amber-400 font-bold">${window.sanitizeHTML(l.loginCoord || 'ACQUIRING...')}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            initCloudSync();
        });

    <div id="modal-logo-config" class="modal-overlay fixed inset-0 bg-void/50 backdrop-blur-md flex items-center justify-center p-3 hidden">
        <div class="modal-content cyber-panel w-full max-w-md p-5 rounded-2xl border-indigo-500/50 space-y-4">
            <h3 class="font-mono text-sm font-bold text-indigo-400">CONFIGURE WEB APP BRANDING</h3>
            <form onsubmit="window.handleLogoConfigSubmit(event)" class="space-y-3">
                <input type="text" id="app-name-input" placeholder="App Title" class="w-full bg-void/80 border border-indigo-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-indigo-400">
                <input type="text" id="logo-url-input" placeholder="Logo Image URL" class="w-full bg-void/80 border border-indigo-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-indigo-400">
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="window.closeLogoConfigModal()" class="flex-1 bg-void border border-rose-500 text-rose-400 py-2 rounded text-xs font-mono font-bold active:scale-95 transition">CANCEL</button>
                    <button type="submit" class="flex-1 bg-indigo-950 border border-indigo-500 text-indigo-300 py-2 rounded text-xs font-mono font-bold active:scale-95 transition">APPLY BRANDING</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADD AGENT MODAL -->
    <div id="modal-add-agent" class="modal-overlay fixed inset-0 bg-void/50 backdrop-blur-md flex items-center justify-center p-3 hidden">
        <div class="modal-content cyber-panel w-full max-w-md p-5 rounded-2xl border-emerald-500/50 space-y-4">
            <h3 class="font-mono text-sm font-bold text-emerald-400">ADD NEW AGENT</h3>
            <form id="add-agent-form" onsubmit="window.handleManualAgentAdd(event)" class="space-y-3">
                <input type="text" id="add-agent-id" required placeholder="Agent ID" class="w-full bg-void/80 border border-emerald-500/40 rounded px-2 py-1.5 text-xs font-mono text-white uppercase focus:outline-none focus:border-emerald-400">
                <input type="text" id="add-agent-name" required placeholder="Full Name" class="w-full bg-void/80 border border-emerald-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-emerald-400">
                <input type="text" id="add-agent-pass" required placeholder="Passcode" class="w-full bg-void/80 border border-emerald-500/40 rounded px-2.5 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-emerald-400">
                <input type="text" id="add-agent-photo" placeholder="Profile Photo URL" class="w-full bg-void/80 border border-emerald-500/40 rounded px-2.5 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-emerald-400">
                <select id="add-agent-clearance" class="w-full bg-void/80 border border-emerald-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-emerald-400">
                    <option value="FIELD">FIELD</option><option value="ADMIN">ADMIN</option>
                </select>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="window.closeAddAgentModal()" class="flex-1 bg-void border border-rose-500 text-rose-400 py-2 rounded text-xs font-mono font-bold active:scale-95 transition">CANCEL</button>
                    <button type="submit" class="flex-1 bg-emerald-950 border border-emerald-500 text-emerald-300 py-2 rounded text-xs font-mono font-bold active:scale-95 transition">CREATE</button>
                </div>
            </form>
        </div>
    </div>

    <!-- EDIT DOSSIER MODAL -->
    <div id="modal-edit-agent" class="modal-overlay fixed inset-0 bg-void/50 backdrop-blur-md flex items-center justify-center p-3 hidden">
        <div class="modal-content cyber-panel w-full max-w-md p-5 rounded-2xl border-cyan-500/50 space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="font-mono text-sm font-bold text-cyan-400">EDIT DOSSIER: <span id="edit-agent-display-id" class="text-amber-300"></span></h3>
            <form onsubmit="window.saveAgentDetails(event)" class="space-y-3">
                <input type="text" id="edit-agent-name" placeholder="Name" class="w-full bg-void/80 border border-cyan-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-cyan-400">
                <input type="text" id="edit-agent-rank" placeholder="Rank" class="w-full bg-void/80 border border-cyan-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-cyan-400">
                <input type="text" id="edit-agent-position" placeholder="Position" class="w-full bg-void/80 border border-cyan-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-cyan-400">
                <input type="text" id="edit-agent-photo" placeholder="Profile Photo URL" class="w-full bg-void/80 border border-cyan-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-cyan-400">
                <div class="border-t border-rose-500/30 pt-2 mt-2">
                    <input type="text" id="edit-agent-new-password" placeholder="New Passcode (Admin only)" class="w-full bg-void/80 border border-rose-500/40 rounded px-2 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-rose-400">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="window.closeEditAgentModal()" class="flex-1 bg-void border border-rose-500 text-rose-400 py-2 rounded text-xs font-mono font-bold active:scale-95 transition">CANCEL</button>
                    <button type="submit" class="flex-1 bg-cyan-950 border border-cyan-500 text-cyan-300 py-2 rounded text-xs font-mono font-bold glow-cyan active:scale-95 transition">SAVE</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS CONTAINER -->
    <div id="toast-container" class="fixed bottom-16 md:bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>
</body>
</html>
